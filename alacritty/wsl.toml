[general]
live_config_reload = true
import = ["themes/zenbones-kanagawabones.toml"]

[terminal]
shell = { program = "wsl.exe", args = ["--distribution", "Ubuntu-22.04", "--cd", "~"] }

[window]
dimensions = { columns = 110, lines = 32 }
padding = { x = 12, y = 10 }
dynamic_padding = true
opacity = 1.0
decorations = "Full"
startup_mode = "Windowed"
title = "Ubuntu 22.04 (WSL)"
dynamic_title = false

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "Jetbrains Mono", style = "Regular" }
size = 11.0

[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = true

[mouse]
bindings = [
    { mouse = "WheelUp", mods = "Control", action = "IncreaseFontSize" },
    { mouse = "WheelDown", mods = "Control", action = "DecreaseFontSize" },
    { mouse = "Right", action = "Paste" }
]

[selection]
save_to_clipboard = true
